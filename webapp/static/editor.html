<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор HTML-деки</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="editor">
  <!-- Thumbnail rail -->
  <aside class="thumbs">
    <div class="thumbs-title">Слайды</div>
    <div id="thumbs"></div>
  </aside>

  <!-- Stage: one big slide -->
  <div class="stage-col">
    <div class="toolbar">
      <a class="home" href="/">&larr; На главную</a>
      <button class="btn btn-ghost" id="prev">&#9664;</button>
      <span class="counter" id="counter">1 / 1</span>
      <button class="btn btn-ghost" id="next">&#9654;</button>
      <span class="sp"></span>
      <button class="btn" id="save">Сохранить</button>
      <button class="btn btn-ghost" id="png">Скачать PNG (ZIP)</button>
      <a class="btn btn-ghost" id="html">Скачать HTML</a>
    </div>
    <div id="frameWrap"><iframe id="deck" title="Презентация"></iframe></div>
  </div>

  <!-- Chat panel -->
  <aside class="chat">
    <div class="chat-head">
      <h3>Правки через чат</h3>
      <p>Опишите изменение для текущего слайда — модель перепишет его.</p>
    </div>
    <div class="chat-log" id="chatLog">
      <div class="chat-empty" id="chatEmpty">
        Например: «сделай заголовок короче», «добавь пункт про безопасность»,
        «перепиши в три колонки».
      </div>
    </div>
    <div class="chat-input">
      <div class="chat-target" id="chatTarget">Слайд 1</div>
      <textarea id="chatText" placeholder="Что изменить на этом слайде?"></textarea>
      <button class="btn" id="chatSend">Применить к слайду</button>
    </div>
  </aside>
</div>
<script src="/static/editor.js"></script>
</body>
</html>
