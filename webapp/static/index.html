<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides App — генерация презентаций</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Slides<span>App</span></div>
  <div class="topbar-sub">Генерация презентаций на моделях Cloud.ru</div>
</header>

<main class="wrap">
  <!-- STEP 1 -->
  <section class="step">
    <div class="step-head"><span class="step-num">1</span><h2>Что получится</h2></div>
    <div class="modes" id="modes">
      <label class="mode" data-mode="htmlnew">
        <input type="radio" name="mode" value="htmlnew" checked>
        <div class="mode-body">
          <div class="mode-title">HTML-презентация <span class="badge">правка в браузере</span></div>
          <div class="mode-desc">Документ &rarr; HTML-дека в бренде Cloud.ru. Правка текста и чат-правки, экспорт в PNG.</div>
          <div class="mode-io"><span class="tag">вход md / txt / docx / pptx</span><span class="arrow">&rarr;</span><span class="tag tag-out">HTML &middot; PNG</span></div>
        </div>
      </label>
    </div>
  </section>

  <!-- STEP 2 -->
  <section class="step">
    <div class="step-head"><span class="step-num">2</span><h2>Загрузите файл</h2></div>
    <label class="drop" id="drop">
      <input type="file" id="file" hidden>
      <div class="drop-inner">
        <div class="drop-icon">&uarr;</div>
        <div class="drop-text" id="dropText">Перетащите файл сюда или нажмите, чтобы выбрать</div>
        <div class="drop-hint" id="dropHint">Допустимо: .pptx</div>
      </div>
    </label>
  </section>

  <!-- STEP 3 -->
  <section class="step">
    <div class="step-head"><span class="step-num">3</span><h2>Запустите сборку</h2></div>
    <button id="create" class="btn btn-lg" disabled>Создать презентацию</button>
  </section>

  <!-- PROGRESS -->
  <section id="progress" class="panel hidden">
    <div class="progress-head">
      <span class="spinner"></span>
      <span id="stageLabel" class="stage-label">Подготовка&hellip;</span>
      <span id="stagePct" class="stage-pct">0%</span>
      <button id="stopBtn" class="btn-link btn-stop" type="button">Остановить</button>
    </div>
    <div class="bar"><div id="barfill"></div></div>
    <div id="stageDetail" class="stage-detail"></div>
    <div id="heartbeat" class="heartbeat">обновлено только что</div>
    <div id="progressLog" class="progress-log"></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="panel hidden"></section>

  <!-- ACTIVE QUEUE -->
  <section class="history" id="activeWrap" hidden>
    <div class="hist-head">
      <h2>Активные сборки <span class="queue-cap" id="queueCap"></span></h2>
    </div>
    <ul id="activeList" class="histlist"></ul>
  </section>

  <!-- HISTORY -->
  <section class="history">
    <div class="hist-head">
      <h2>История сборок</h2>
      <button id="clear" class="btn-link">Очистить</button>
    </div>
    <ul id="histlist" class="histlist"></ul>
    <div id="histEmpty" class="hist-empty">Пока пусто &mdash; создайте первую презентацию.</div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
